name: Build & Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugins & Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build plugin bundles and catalog
        run: npm run build

      - name: Verify catalog generated
        run: |
          test -f public/catalog.json
          echo "Marketplace catalog generated successfully"
